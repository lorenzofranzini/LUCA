<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong: Streamer Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff0000;
        }

        canvas {
            border: 4px solid #ff0000;
            background-color: #000;
            cursor: none;
        }

        .istruzioni {
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>PONG IGNORANTE</h1>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <p class="istruzioni">Muovi il mouse e NON FAR PASSARE LA PALLA 😤</p>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Pallina (più lenta)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speedX: 3.5,
            speedY: 3.5,
            color: "#ffcc00"
        };

        const paddleWidth = 10;
        const paddleHeight = 100;

        const player = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            score: 0
        };

        const computer = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            score: 0
        };

        // Mouse control
        canvas.addEventListener("mousemove", (event) => {
            let rect = canvas.getBoundingClientRect();
            player.y = event.clientY - rect.top - paddleHeight / 2;

            // Limiti
            player.y = Math.max(0, Math.min(canvas.height - paddleHeight, player.y));
        });

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function drawText(text, x, y) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 40px Arial";
            ctx.fillText(text, x, y);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX = -ball.speedX;
            ball.speedY = 3.5 * (Math.random() > 0.5 ? 1 : -1);
        }

        function update() {
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // IA
            let computerLevel = 0.08;
            computer.y += (ball.y - (computer.y + paddleHeight / 2)) * computerLevel;

            // Rimbalzo
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
            }

            // Punti
            if (ball.x < 0) {
                computer.score++;
                resetBall();
            } else if (ball.x > canvas.width) {
                player.score++;
                resetBall();
            }

            let currentPaddle = (ball.x < canvas.width / 2) ? player : computer;

            if (
                ball.x + ball.radius > currentPaddle.x &&
                ball.x - ball.radius < currentPaddle.x + paddleWidth &&
                ball.y > currentPaddle.y &&
                ball.y < currentPaddle.y + paddleHeight
            ) {
                ball.speedX = -ball.speedX;

                // velocità limitata
                const maxSpeed = 10;
                ball.speedX = Math.sign(ball.speedX) * Math.min(Math.abs(ball.speedX * 1.05), maxSpeed);
            }
        }

        function render() {
            drawRect(0, 0, canvas.width, canvas.height, "#111");

            // Rete
            for (let i = 0; i < canvas.height; i += 30) {
                drawRect(canvas.width / 2 - 1, i, 2, 15, "#444");
            }

            // Score
            drawText(player.score, canvas.width / 4, 60);
            drawText(computer.score, (3 * canvas.width) / 4, 60);

            // Racchette
            drawRect(player.x, player.y, paddleWidth, paddleHeight, "#ff0000");
            drawRect(computer.x, computer.y, paddleWidth, paddleHeight, "#ffff00");

            // Pallina
            drawCircle(ball.x, ball.y, ball.radius, ball.color);
        }

        function game() {
            update();
            render();
        }

        setInterval(game, 1000 / 60);
    </script>

</body>
</html>
